name: PR Check

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, v4-wip ]

jobs:

  build-and-test:
    strategy:
      matrix:
        dotnet: ['7.0.410']
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Install dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Install MAUI Windows workload
      run: dotnet workload install maui-windows

    - name: Clean
      run: dotnet clean --configuration Debug && dotnet nuget locals all --clear
    
    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Test
      run: dotnet test

  publish-ui-dist:
    name: Publish UI Distribution
    runs-on: 'windows-latest'
    needs: build-and-test
    strategy:
      matrix:
        dotnet: [ '7.0.410' ]
        framework: ['net7.0-windows10.0.22621.0']
        os: [ 'win10-x64' ]

    steps:

      - uses: actions/checkout@v3
      - name: Publish UI Distribution
        uses: ./.github/actions/publish-ui-dist
        with:
          dotnet-version: ${{ matrix.dotnet }}
          os: ${{ matrix.os }}
          framework: ${{ matrix.framework }}
 
  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
          dockerfile: ['Dockerfile.console', 'Dockerfile.api', 'Dockerfile.webui']
          include:
              - dockerfile: 'Dockerfile.console'
                image: 'peloton-to-garmin-pr-console'
              - dockerfile: 'Dockerfile.api'
                image: 'peloton-to-garmin-pr-api'
              - dockerfile: 'Dockerfile.webui'
                image: 'peloton-to-garmin-pr-webui'

    steps:

    - uses: actions/checkout@v3
    - name: Build ${{ matrix.dockerfile }}
      run: docker build --file docker/${{ matrix.dockerfile }} --tag ${{ matrix.image }}:pr-validator --build-arg VERSION=0.0.0-pr.1 .
